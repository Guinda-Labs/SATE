# SPDX-License-Identifier: CC0-1.0
# Textos de SATE (Sistema de Apoyo a la Trayectoria Escolar) en español de México, tuteo.
# Reglas: claves a-z0-9_ con puntos; variables {nombre}; plurales {n, plural, one {# x} other {# xs}}.
# Al cambiar un texto: sube `version` y valida con `python tools/contenido.py`.
version = "2026.10.30"

[sate.creditos]
rotulo = "créditos"
escala = "Créditos TEPIC, la escala que usa el SAES"
contexto = "{escala}. {explicacion}"
detalle = "{cr} créditos (SATCA: {satca})"
calculado = "≈ indica un cálculo a partir de las horas del SAES: se dividen las horas semestrales entre 18 y se calcula TEPIC = 2 × horas semanales de teoría + horas semanales de práctica."
ayuda = "En los mapas curriculares del IPN, una misma materia puede tener dos cifras de créditos. SATE usa la escala TEPIC, la misma del SAES: cada hora semanal de teoría vale dos créditos y cada hora semanal de práctica, uno; por ejemplo, 3 horas de teoría y 1.5 de práctica suman 7.5 créditos. La escala SATCA (ANUIES, 2007) parte de las horas de trabajo de todo el semestre, no de las horas por semana. Por eso las dos cifras no coinciden y no se comparan entre sí. Tu carga autorizada y tus totales están en TEPIC. Fuente: <a href=\"https://doi.org/10.22201/iisue.20072872e.2011.4.40\" target=\"_blank\" rel=\"noopener\">ANUIES, RIES (2011)</a>."

[proyecto]
nombre = "HADES"

[proyecto.apoyo]
# Enlace en el pie de Horarios, la portada y el agradecimiento de la encuesta.
enlace = "Apoya el proyecto"
ayuda = "Donar es voluntario; el proyecto es gratuito y lo mantiene un alumno del IPN."

[sate]
