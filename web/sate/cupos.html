<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cupos · SATE</title>
<link rel="stylesheet" href="componentes.css"><style>/*__CUENTA_CSS__*/
:root{color-scheme:light dark;--ipn-texto:#29252b;--ipn-superficie:#fff;--ipn-linea:#ded8dc;--ipn-acento:#71334c}body{font:16px/1.6 system-ui;margin:24px;background:var(--ipn-superficie);color:var(--ipn-texto)}h1{font-size:1.4rem}main{max-width:34rem;margin:auto}a{color:var(--ipn-acento)}:focus-visible{outline:3px solid var(--ipn-acento)}@media(prefers-color-scheme:dark){:root{--ipn-texto:#eee8eb;--ipn-superficie:#211e22;--ipn-linea:#61565e;--ipn-acento:#efb7ce}}</style></head>
<style>
:root{--ipn-esp-2:.5rem;--ipn-esp-3:.75rem;--ipn-esp-4:1rem;--ipn-esp-5:1.5rem;--ipn-esp-6:2rem;--ipn-radio:12px;--ipn-fuente-texto:system-ui;--ipn-tamano-m:1.15rem;--ipn-tamano-s:1rem;--sate-acento-base:var(--ipn-acento)}#cupos-tarjetas>h2{grid-column:1/-1}
main{max-width:72rem}button,input,select{font:inherit;color:inherit;background:var(--ipn-superficie);border:1px solid var(--ipn-linea);border-radius:8px;padding:8px}button{cursor:pointer}label{display:inline-flex;align-items:center;gap:6px;margin:4px 8px 8px 0;max-width:100%}select,input{min-width:0;max-width:100%}#cupos-tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin:16px 0}article{min-width:0;padding:14px;border:1px solid var(--ipn-linea);border-radius:12px}article header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px}article header button{min-width:0;text-align:left;overflow-wrap:anywhere}article header strong{white-space:nowrap;align-self:start;color:var(--ipn-acento)}article p{overflow-wrap:anywhere;margin:8px 0}.tabla{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--ipn-linea)}td:nth-child(2){min-width:12rem;max-width:28rem;overflow-wrap:anywhere}td:last-child{white-space:nowrap}.elegido{background:color-mix(in srgb,var(--ipn-acento) 8%,var(--ipn-superficie))}@media(max-width:480px){body{margin:12px}label{display:flex}article{padding:10px}}
</style><body><main><h1 id="cupos-titulo"></h1><p id="cupos-resumen" role="status" aria-live="polite"></p><p id="cupos-dejar"></p>
<div id="cupos-controles"></div><div id="cupos-tarjetas"></div><div id="cupos-tabla" class="tabla"></div>
<button id="cupos-permitir" type="button" hidden></button><p id="cupos-aviso" role="status" aria-live="polite"></p><p id="cupos-nube" role="status"></p><a href="index.html" id="cupos-volver"></a><!--__CUENTA_BTN__--></main>
<script>/*__CUPOS_CONFIG__*/</script><script>/*__CUENTA_JS__*/</script><script src="componentes.js"></script><script src="cupos-comun.js"></script><script src="cupos-receptor.js"></script></body></html>
